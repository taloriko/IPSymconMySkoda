name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: PHP syntax
        run: |
          find MySkoda tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
      - name: Validate JSON
        run: |
          python3 -m json.tool library.json > /dev/null
          python3 -m json.tool MySkoda/module.json > /dev/null
          python3 -m json.tool MySkoda/form.json > /dev/null
          python3 -m json.tool MySkoda/locale.json > /dev/null
      - name: Validate module structure and documentation
        run: python3 tests/validate_structure.py
      - name: Test runtime invariants without network
        run: php -d disable_functions=curl_init,curl_exec tests/runtime_invariants.php
      - name: Test API information values without network
        run: php -d disable_functions=curl_init,curl_exec tests/api_information_values.php
