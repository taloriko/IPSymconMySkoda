name: Remove merged release branches

on:
  push:
    branches: [main]
    paths: ['.github/workflows/cleanup-release-branches.yml']

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'taloriko/IPSymconMySkoda' && github.ref == 'refs/heads/main' && github.run_attempt == '1'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate current module before branch cleanup
        run: |
          find MySkoda tests -type f -name '*.php' -print0 | xargs -0 -n1 php -l
          python3 tests/validate_structure.py
          php -d disable_functions=curl_init,curl_exec tests/runtime_invariants.php
          php -d disable_functions=curl_init,curl_exec tests/api_information_values.php

  cleanup:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Remove only the five reviewed and fully merged branches
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import urllib.error
          import urllib.request

          repository = 'taloriko/IPSymconMySkoda'
          if os.environ['GITHUB_REPOSITORY'] != repository or os.environ['GITHUB_REF'] != 'refs/heads/main':
              raise RuntimeError('Unexpected repository or branch; no deletion allowed.')
          if os.environ['GITHUB_RUN_ATTEMPT'] != '1':
              raise RuntimeError('This one-time cleanup cannot be rerun.')
          root = 'https://api.github.com/repos/' + repository
          headers = {
              'Accept': 'application/vnd.github+json',
              'Authorization': 'Bearer ' + os.environ['GH_TOKEN'],
              'X-GitHub-Api-Version': '2022-11-28',
              'User-Agent': 'MySkoda-release-branch-cleanup'
          }

          def request(method, path, absent_ok=False):
              req = urllib.request.Request(root + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=30) as response:
                      if method == 'DELETE':
                          if response.status != 204:
                              raise RuntimeError('Unexpected deletion response.')
                          return None
                      return json.load(response)
              except urllib.error.HTTPError as error:
                  if absent_ok and error.code == 404:
                      return None
                  raise RuntimeError(f'{method} {path}: HTTP {error.code}') from None

          expected = {
              'release-1.1': '7bc8e6d1415d276d2d3b82a91828ed22b53c28a2',
              'release-1.2': 'd1beab0340192be0060f66282bdae609a815b504',
              'release-1.3': '5ff4a5536ae1850219dfca64ca39d9488747051c',
              'release-1.4': '1a7f26a2cdb9e2ec457cb1443410a78f745a5566',
              'release-1.5': '689185a0d07261958359c069f863509e7f82e9d4'
          }
          main_sha = request('GET', '/git/ref/heads/main')['object']['sha']
          if main_sha != os.environ['GITHUB_SHA']:
              raise RuntimeError('Main changed since this cleanup was requested.')

          # Preflight every branch before making the first deletion.
          pending = []
          for branch, sha in expected.items():
              ref = request('GET', '/git/ref/heads/' + branch, absent_ok=True)
              if ref is None:
                  print(branch + ': already absent')
                  continue
              if ref['object']['sha'] != sha:
                  raise RuntimeError(branch + ': changed since review; no deletion.')
              comparison = request('GET', '/compare/' + sha + '...' + main_sha)
              if comparison['status'] not in ('ahead', 'identical') or comparison['merge_base_commit']['sha'] != sha:
                  raise RuntimeError(branch + ': commits are not fully contained in main.')
              pending.append((branch, sha))

          for branch, sha in pending:
              ref = request('GET', '/git/ref/heads/' + branch, absent_ok=True)
              if ref is None:
                  continue
              if ref['object']['sha'] != sha:
                  raise RuntimeError(branch + ': changed during cleanup; stop.')
              request('DELETE', '/git/refs/heads/' + branch)
              if request('GET', '/git/ref/heads/' + branch, absent_ok=True) is not None:
                  raise RuntimeError(branch + ': deletion could not be verified.')
              print('Deleted ' + branch)

          if request('GET', '/git/ref/heads/main')['object']['sha'] != main_sha:
              raise RuntimeError('Main moved during cleanup; inspect concurrent changes.')
          print('Cleanup complete; main and its complete commit history were preserved.')
          PY
