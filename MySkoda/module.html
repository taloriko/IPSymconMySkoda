<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
    --ok:#22a35a;
    --warn:#d58a00;
    --error:#dc4040;
    --line:rgba(127,127,127,.22);
    --muted:rgba(127,127,127,.14);
    --accent:rgba(40,205,171,.78);
}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;color:inherit;overflow:hidden}
body{font-family:system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}
.tile{width:100%;height:100%;min-height:220px;padding:8px 10px;display:flex;flex-direction:column;gap:5px;color:inherit;background:transparent;line-height:1.15}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding-bottom:5px;border-bottom:1px solid var(--line)}
.title{font-size:1.08rem;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.range{font-size:.68rem;opacity:.72;margin-top:2px}.range strong{font-size:.82rem;opacity:1}.headright{text-align:right}.lockhead{font-size:1rem;line-height:1}.age{font-size:.61rem;opacity:.62;margin-top:2px;white-space:nowrap}
.keywarn{display:none;padding:4px 7px;border-left:3px solid var(--warn);background:rgba(213,138,0,.09);font-size:.63rem;font-weight:650}
.main{display:grid;grid-template-columns:minmax(125px,43%) 1fr;gap:9px;align-items:center;min-height:0;flex:1}
.carwrap{min-width:0;min-height:0;height:100%;display:flex;align-items:center;justify-content:center}.car-svg{width:100%;height:100%;max-height:205px;min-height:145px}
.charge{min-width:0;padding-left:9px;border-left:1px dotted var(--accent)}.chargehead{display:flex;gap:7px;align-items:center;margin-bottom:7px}.plugicon{width:27px;text-align:center;font-size:1.45rem;line-height:1}.chargecopy{min-width:0}.chargetitle{font-size:.82rem;font-weight:780;white-space:normal}.chargetype{font-size:.58rem;opacity:.64;margin-top:2px}.charge.ok .chargetitle,.charge.done .chargetitle{color:var(--ok)}.charge.warn .chargetitle{color:var(--warn)}.charge.error .chargetitle{color:var(--error)}.charge.idle .chargetitle{opacity:.72}
.metrics{display:grid;grid-template-columns:1fr 1fr;gap:6px 10px}.metric-label{font-size:.5rem;text-transform:uppercase;letter-spacing:.025em;opacity:.56}.metric-value{font-size:.8rem;font-weight:730;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.statusbar{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:3px;padding:5px 0;border-top:1px solid var(--line);border-bottom:1px solid var(--line)}.statusitem{min-width:0;text-align:center;font-size:.56rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.dot{display:inline-block;width:6px;height:6px;border-radius:50%;margin-right:3px;vertical-align:1px}.good .dot{background:var(--ok)}.attention .dot{background:var(--warn)}
.bottom{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding-top:1px}.climate{min-width:0;display:flex;align-items:center;gap:7px}.climateicon{width:26px;height:26px;flex:0 0 26px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.11);font-size:.85rem}.climate.active .climateicon{color:var(--ok);background:rgba(34,163,90,.12)}.climatecopy{min-width:0}.climateline{font-size:.7rem;font-weight:760;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.climatesub{font-size:.57rem;opacity:.62;margin-top:1px}.km{text-align:right;font-size:.56rem;opacity:.64;white-space:nowrap}.km strong{display:block;font-size:.7rem;opacity:1;margin-top:1px}
.car-body{fill:url(#bodyGradient);stroke-width:2.4}.normal-outline{stroke:var(--ok)}.attention-outline{stroke:var(--warn)}.glass{fill:url(#glassGradient);stroke:rgba(127,127,127,.30);stroke-width:1}.door-mark{fill:none;stroke:rgba(127,127,127,.20);stroke-width:4.5;stroke-linecap:round}.door-mark.attention{stroke:var(--warn)}.window-mark{fill:none;stroke:rgba(127,127,127,.18);stroke-width:2}.window-mark.attention{stroke:var(--warn);stroke-width:3}.lamp{fill:rgba(127,127,127,.18)}.lamp.attention{fill:#f2b400}.wheel{fill:rgba(75,75,75,.80);stroke:rgba(127,127,127,.42);stroke-width:1}.wheel-core{fill:rgba(180,180,180,.28)}.mirror{fill:rgba(127,127,127,.22);stroke:rgba(127,127,127,.34)}
.battery-shell{fill:rgba(127,127,127,.08);stroke:rgba(127,127,127,.58);stroke-width:1.4}.battery-tip{fill:rgba(127,127,127,.58)}.battery-segment{fill:rgba(127,127,127,.14);transition:fill .25s ease,opacity .25s ease}.battery-text{fill:currentColor;font:780 18px system-ui}.limit-text{fill:currentColor;font:600 7.2px system-ui;opacity:.67}.car-shadow{fill:rgba(0,0,0,.12)}
@media(max-width:390px){.tile{padding:6px 7px}.main{grid-template-columns:119px 1fr;gap:6px}.charge{padding-left:6px}.metrics{gap:5px 6px}.metric-value{font-size:.73rem}.statusitem{font-size:.5rem}.car-svg{min-height:138px}.climateline{font-size:.66rem}}
@media(max-height:260px){.tile{gap:3px}.main{min-height:132px}.car-svg{max-height:160px}.statusbar{padding:3px 0}.bottom{padding-top:0}}
</style>
</head>
<body>
<div class="tile">
    <div class="head">
        <div style="min-width:0">
            <div id="title" class="title">MySkoda</div>
            <div class="range"><span id="rangeLabel">Reichweite</span> <strong id="range">—</strong></div>
        </div>
        <div class="headright">
            <div id="lockHead" class="lockhead">🔒</div>
            <div class="age"><span id="updatedLabel">Alter</span> <span id="age">--:--</span></div>
        </div>
    </div>

    <div id="keyWarning" class="keywarn"></div>

    <div class="main">
        <div class="carwrap">
            <svg class="car-svg" viewBox="0 0 190 260" role="img" aria-label="Vehicle">
                <defs>
                    <linearGradient id="bodyGradient" x1="0" y1="0" x2="1" y2="1">
                        <stop offset="0" stop-color="currentColor" stop-opacity=".22"/>
                        <stop offset=".28" stop-color="currentColor" stop-opacity=".08"/>
                        <stop offset=".60" stop-color="currentColor" stop-opacity=".035"/>
                        <stop offset="1" stop-color="currentColor" stop-opacity=".18"/>
                    </linearGradient>
                    <linearGradient id="glassGradient" x1="0" y1="0" x2="0" y2="1">
                        <stop offset="0" stop-color="#9bb7c7" stop-opacity=".48"/>
                        <stop offset="1" stop-color="#324c5b" stop-opacity=".22"/>
                    </linearGradient>
                </defs>

                <ellipse class="car-shadow" cx="95" cy="137" rx="60" ry="111"/>

                <ellipse class="wheel" cx="43" cy="70" rx="8" ry="22"/><ellipse class="wheel-core" cx="43" cy="70" rx="3" ry="12"/>
                <ellipse class="wheel" cx="147" cy="70" rx="8" ry="22"/><ellipse class="wheel-core" cx="147" cy="70" rx="3" ry="12"/>
                <ellipse class="wheel" cx="43" cy="190" rx="8" ry="22"/><ellipse class="wheel-core" cx="43" cy="190" rx="3" ry="12"/>
                <ellipse class="wheel" cx="147" cy="190" rx="8" ry="22"/><ellipse class="wheel-core" cx="147" cy="190" rx="3" ry="12"/>

                <path id="carBody" class="car-body normal-outline" d="M66 13 Q95 3 124 13 Q140 21 146 42 L151 83 L155 177 Q153 219 128 243 Q95 254 62 243 Q37 219 35 177 L39 83 L44 42 Q50 21 66 13Z"/>
                <path class="mirror" d="M42 61 Q28 55 26 68 Q29 79 40 76Z"/><path class="mirror" d="M148 61 Q162 55 164 68 Q161 79 150 76Z"/>

                <path id="frontGlass" class="glass" d="M64 38 Q95 28 126 38 L134 85 Q95 73 56 85Z"/>
                <path id="rearGlass" class="glass" d="M56 174 Q95 187 134 174 L126 222 Q95 232 64 222Z"/>
                <path class="window-mark" id="windowMarkL" d="M55 92 L48 112 L48 163 L57 170"/>
                <path class="window-mark" id="windowMarkR" d="M135 92 L142 112 L142 163 L133 170"/>

                <path id="doorMarkL" class="door-mark" d="M48 91 L39 100 L38 160 L49 169"/>
                <path id="doorMarkR" class="door-mark" d="M142 91 L151 100 L152 160 L141 169"/>
                <path d="M58 88 C78 80 112 80 132 88 L137 169 C115 178 75 178 53 169Z" fill="rgba(127,127,127,.045)" stroke="rgba(127,127,127,.18)" stroke-width="1.1"/>

                <path id="frontLamp" class="lamp" d="M61 22 Q95 13 129 22 L125 28 Q95 21 65 28Z"/>
                <path id="rearLamp" class="lamp" d="M65 235 Q95 244 125 235 L120 241 Q95 248 70 241Z"/>

                <g transform="translate(56 108)">
                    <rect class="battery-shell" x="0" y="0" width="78" height="37" rx="6"/>
                    <rect class="battery-tip" x="78" y="12" width="4" height="13" rx="1.5"/>
                    <rect id="bat1" class="battery-segment" x="7" y="7" width="13" height="13" rx="2"/>
                    <rect id="bat2" class="battery-segment" x="24" y="7" width="13" height="13" rx="2"/>
                    <rect id="bat3" class="battery-segment" x="41" y="7" width="13" height="13" rx="2"/>
                    <rect id="bat4" class="battery-segment" x="58" y="7" width="13" height="13" rx="2"/>
                    <text id="socText" class="battery-text" x="39" y="34" text-anchor="middle">--%</text>
                    <text id="limitText" class="limit-text" x="39" y="47" text-anchor="middle">Limit —</text>
                </g>
            </svg>
        </div>

        <div id="charge" class="charge idle">
            <div class="chargehead">
                <div id="plugIcon" class="plugicon">○</div>
                <div class="chargecopy">
                    <div id="chargeLabel" class="chargetitle">Nicht verbunden</div>
                    <div id="chargeType" class="chargetype"></div>
                </div>
            </div>
            <div class="metrics">
                <div><div id="powerLabel" class="metric-label">Leistung</div><div id="power" class="metric-value">—</div></div>
                <div><div id="timeLabel" class="metric-label">Zeit bis voll</div><div id="time" class="metric-value">—</div></div>
                <div><div id="limitLabel" class="metric-label">Ladelimit</div><div id="chargeLimit" class="metric-value">—</div></div>
                <div><div id="modeLabel" class="metric-label">Modus</div><div id="chargeMode" class="metric-value">—</div></div>
            </div>
        </div>
    </div>

    <div class="statusbar">
        <div id="lockStatus" class="statusitem good"><span class="dot"></span><span class="txt">Verriegelt</span></div>
        <div id="doorStatus" class="statusitem good"><span class="dot"></span><span class="txt">Türen zu</span></div>
        <div id="windowStatus" class="statusitem good"><span class="dot"></span><span class="txt">Fenster zu</span></div>
        <div id="lightStatus" class="statusitem good"><span class="dot"></span><span class="txt">Licht aus</span></div>
    </div>

    <div class="bottom">
        <div id="climate" class="climate">
            <div id="climateIcon" class="climateicon">○</div>
            <div class="climatecopy">
                <div class="climateline"><span id="climateLabel">Klima</span>: <span id="climateMode">Aus</span></div>
                <div class="climatesub"><span id="targetTempLabel">Solltemperatur</span> <span id="targetTemperature">—</span></div>
            </div>
        </div>
        <div class="km"><span id="mileageLabel">Kilometerstand</span><strong id="mileage">—</strong></div>
    </div>
</div>

<script>
function byId(id){return document.getElementById(id)}
function text(id,value){const el=byId(id);if(el)el.textContent=value ?? ''}
function toggleClass(el,name,on){if(el)el.classList.toggle(name,!!on)}
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
function hexToRgb(hex){hex=hex.replace('#','');return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
function rgbToHex(rgb){return '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('')}
function mixColor(a,b,t){const ar=hexToRgb(a),br=hexToRgb(b);return rgbToHex([lerp(ar[0],br[0],t),lerp(ar[1],br[1],t),lerp(ar[2],br[2],t)])}
function batteryColor(soc){
    const stops=[[0,'#d93f43'],[10,'#d93f43'],[25,'#f59e0b'],[80,'#79c267'],[100,'#138a4b']];
    const v=Math.max(0,Math.min(100,Number(soc)||0));
    for(let i=1;i<stops.length;i++){
        if(v<=stops[i][0]){
            const p=(v-stops[i-1][0])/(stops[i][0]-stops[i-1][0]||1);
            return mixColor(stops[i-1][1],stops[i][1],p);
        }
    }
    return stops[stops.length-1][1];
}
function updateBattery(soc,target){
    const valid=Number.isFinite(Number(soc));
    const value=valid?Math.max(0,Math.min(100,Number(soc))):0;
    const filled=valid&&value>0?Math.max(1,Math.min(4,Math.ceil(value/25))):0;
    const color=batteryColor(value);
    for(let i=1;i<=4;i++){
        const el=byId('bat'+i);
        if(!el)continue;
        el.style.fill=i<=filled?color:'rgba(127,127,127,.14)';
        el.style.opacity=i<=filled?'1':'.62';
    }
    text('socText',valid?Math.round(value)+'%':'--%');
    text('limitText','Limit '+(target===null||target===undefined?'—':target+'%'));
}
function updateStatus(id,label,good){
    const el=byId(id); if(!el)return;
    el.classList.toggle('good',!!good);el.classList.toggle('attention',!good);
    const txt=el.querySelector('.txt'); if(txt)txt.textContent=label||'';
}
function handleMessage(message){
    let data=message;
    if(typeof data==='string'){
        try{data=JSON.parse(data)}catch(e){return}
    }
    if(!data||typeof data!=='object')return;

    const labels=data.labels||{};
    text('title',data.title||'MySkoda');text('range',data.range||'—');text('age',data.age||'--:--');text('mileage',data.mileage||'—');
    text('rangeLabel',labels.range||'Range');text('updatedLabel',labels.updated||'Updated');text('mileageLabel',labels.mileage||'Mileage');
    text('powerLabel',labels.power||'Power');text('timeLabel',labels.time||'Time');text('limitLabel',labels.limit||'Limit');text('modeLabel',labels.mode||'Mode');text('climateLabel',labels.climate||'Climate');text('targetTempLabel',labels.targetTemperature||'Target');

    text('lockHead',data.locked?'🔒':'🔓');
    updateBattery(data.soc,data.targetSoc);

    const body=byId('carBody');
    if(body){body.classList.toggle('normal-outline',!!data.locked);body.classList.toggle('attention-outline',!data.locked)}
    toggleClass(byId('doorMarkL'),'attention',!!data.doorsOpen);toggleClass(byId('doorMarkR'),'attention',!!data.doorsOpen);
    toggleClass(byId('windowMarkL'),'attention',!!data.windowsOpen);toggleClass(byId('windowMarkR'),'attention',!!data.windowsOpen);
    toggleClass(byId('frontLamp'),'attention',!!data.lightsOn);toggleClass(byId('rearLamp'),'attention',!!data.lightsOn);

    updateStatus('lockStatus',data.lockText,!!data.locked);
    updateStatus('doorStatus',data.doorsText,!data.doorsOpen);
    updateStatus('windowStatus',data.windowsText,!data.windowsOpen);
    updateStatus('lightStatus',data.lightsText,!data.lightsOn);

    const charge=data.charge||{};
    const chargeEl=byId('charge');
    if(chargeEl){chargeEl.className='charge '+(charge.stateClass||'idle')}
    text('plugIcon',charge.icon||'○');text('chargeLabel',charge.label||'');text('chargeType',charge.type||'');
    text('power',charge.power||'—');text('time',charge.time||'—');text('chargeLimit',charge.limit||'—');text('chargeMode',charge.mode||'—');

    const climate=data.climate||{};
    const climateEl=byId('climate');toggleClass(climateEl,'active',!!climate.active);
    text('climateIcon',climate.symbol||'○');text('climateMode',climate.mode||'—');text('targetTemperature',climate.temperature||'—');

    const keyWarn=byId('keyWarning');
    if(keyWarn){keyWarn.style.display=data.keyWarning?'block':'none';keyWarn.textContent=data.keyWarning?'⚠ '+(data.keyWarningText||''):''}
}
</script>
</body>
</html>
