<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{color-scheme:light dark;--ok:#18a34a;--warn:#d88608;--error:#d64242;--line:rgba(127,127,127,.22);--soft:rgba(127,127,127,.075);--soft2:rgba(127,127,127,.12)}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:transparent;color:inherit}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif}
.tile{width:100%;height:100%;min-height:0;padding:8px 10px;display:grid;grid-template-rows:auto auto minmax(0,1fr) auto auto;gap:6px;overflow:hidden;background:transparent;color:inherit;line-height:1.12}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:1px 1px 6px;border-bottom:1px solid var(--line)}
.title{font-size:1.08rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.range{font-size:.67rem;opacity:.7;margin-top:2px}.range strong{font-size:.83rem;opacity:1}.age{text-align:right;font-size:.60rem;opacity:.62;white-space:nowrap;padding-top:3px}
.keywarn{display:none;padding:5px 8px;border-left:3px solid var(--warn);background:rgba(216,134,8,.09);font-size:.61rem;font-weight:650}
.hero{min-height:0;display:grid;grid-template-columns:minmax(145px,44%) minmax(0,1fr);gap:10px;align-items:stretch;overflow:hidden}
.car-panel{min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;padding:1px 0}.car-svg{width:100%;height:100%;min-height:190px;max-height:100%;filter:drop-shadow(0 5px 7px rgba(0,0,0,.12))}
.rightcol{min-width:0;min-height:0;display:flex;flex-direction:column;justify-content:center}.chargebox{min-width:0;padding:9px 10px;background:var(--soft);border-radius:12px}.chargehead{display:flex;align-items:center;gap:8px;padding-bottom:7px}.plugcircle{width:34px;height:34px;flex:0 0 34px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft2)}.plugicon{font-size:1.25rem;line-height:1}.chargecopy{min-width:0}.chargetitle{font-size:.79rem;font-weight:790;line-height:1.15}.chargehint{font-size:.56rem;opacity:.62;margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.chargebox.ok .chargetitle,.chargebox.done .chargetitle{color:var(--ok)}.chargebox.warn .chargetitle{color:var(--warn)}.chargebox.error .chargetitle{color:var(--error)}
.metrics{border-top:1px solid var(--line)}.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:7px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric-label{font-size:.58rem;opacity:.6;white-space:nowrap}.metric-value{font-size:.77rem;font-weight:760;text-align:right;white-space:nowrap}
.lockline{min-height:30px;display:flex;align-items:center;justify-content:center;gap:7px;border-top:1px solid var(--line);border-bottom:1px solid var(--line);font-size:.68rem;font-weight:760;color:var(--ok)}.lockline.attention{color:var(--warn)}.lockicon{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
.quickline{min-width:0;display:grid;grid-template-columns:minmax(0,1.35fr) minmax(112px,.65fr);gap:8px;align-items:center;padding:1px 0}.climatecompact{min-width:0;display:flex;align-items:center;gap:6px;white-space:nowrap;overflow:hidden}.climateicon{width:28px;height:28px;flex:0 0 28px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft2);font-size:.88rem}.climatecompact.active .climateicon{color:var(--ok);background:rgba(24,163,74,.12)}.climate-text{min-width:0;font-size:.68rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.climate-text strong{font-size:.74rem}.climate-temp{opacity:.68;margin-left:4px}.kmcompact{min-width:0;text-align:right;white-space:nowrap}.kmlabel{font-size:.55rem;opacity:.62}.kmvalue{font-size:.76rem;font-weight:790;margin-top:1px}.kmshort{display:none}
.car-body{fill:url(#bodyGradient);stroke-width:2.2}.car-outline-good{stroke:var(--ok)}.car-outline-attn{stroke:var(--warn)}.glass{fill:url(#glassGradient);stroke:rgba(127,127,127,.34);stroke-width:1}.roof-glass{fill:rgba(18,27,34,.86);stroke:rgba(127,127,127,.40);stroke-width:1.1}.roof-glass.attention{stroke:var(--warn);stroke-width:3}.wheel{fill:#2b2f33;stroke:rgba(127,127,127,.42);stroke-width:1}.wheelhub{fill:rgba(200,200,200,.20)}.mirror{fill:url(#bodyGradient);stroke:rgba(127,127,127,.48);stroke-width:1}.body-line,.door-line,.window-line{fill:none;stroke:rgba(127,127,127,.28);stroke-width:1.35;stroke-linecap:round;stroke-linejoin:round}.door-line.attention,.window-line.attention,.body-line.attention{stroke:var(--warn);stroke-width:3}.lamp{fill:rgba(127,127,127,.16);stroke:rgba(127,127,127,.20);stroke-width:.6}.lamp.attention{fill:#f0aa16;stroke:#f0aa16;filter:drop-shadow(0 0 2px rgba(240,170,22,.55))}.battery-shell{fill:rgba(245,245,245,.90);stroke:rgba(70,70,70,.40);stroke-width:1.1}.battery-tip{fill:rgba(90,90,90,.65)}.battery-segment{fill:rgba(127,127,127,.14)}.battery-text{fill:#111827;font:800 20px system-ui}.limit-text{fill:#374151;font:600 7.6px system-ui;opacity:.8}
@media(prefers-color-scheme:dark){.battery-shell{fill:rgba(25,30,35,.92);stroke:rgba(210,210,210,.38)}.battery-text{fill:#f4f4f5}.limit-text{fill:#d1d5db}.chargebox{background:rgba(255,255,255,.055)}}
@media(max-width:430px){.tile{padding:7px 8px;gap:5px}.hero{grid-template-columns:minmax(132px,43%) minmax(0,1fr);gap:7px}.chargebox{padding:8px}.plugcircle{width:30px;height:30px;flex-basis:30px}.chargetitle{font-size:.73rem}.metric{padding:5px 0}.metric-label{font-size:.53rem}.metric-value{font-size:.71rem}.quickline{grid-template-columns:minmax(0,1.42fr) minmax(92px,.58fr);gap:5px}.climateicon{width:25px;height:25px;flex-basis:25px}.climate-text{font-size:.60rem}.climate-text strong{font-size:.67rem}.kmlabel{font-size:.50rem}.kmvalue{font-size:.68rem}.kmfull{display:none}.kmshort{display:inline}.lockline{min-height:27px;font-size:.63rem}}
@media(max-width:350px){.hero{grid-template-columns:118px minmax(0,1fr)}.chargehint{display:none}.plugcircle{width:27px;height:27px;flex-basis:27px}.metric-label{font-size:.49rem}.metric-value{font-size:.67rem}.climate-temp{margin-left:2px}.quickline{grid-template-columns:minmax(0,1.5fr) minmax(82px,.5fr)}}
@media(max-height:360px){.tile{padding-top:5px;padding-bottom:5px}.range{display:none}.hero{gap:6px}.car-svg{min-height:150px}.chargebox{padding:6px 8px}.chargehead{padding-bottom:5px}.metric{padding:4px 0}.lockline{min-height:24px}.quickline{padding:0}}
</style>
</head>

    <div class="rightcol"><div id="charge" class="chargebox idle"><div class="chargehead"><div class="plugcircle"><div id="plugIcon" class="plugicon">○</div></div><div class="chargecopy"><div id="chargeLabel" class="chargetitle">Nicht verbunden</div><div id="chargeHint" class="chargehint"></div></div></div><div class="metrics"><div class="metric"><span id="powerLabel" class="metric-label">Ladeleistung</span><span id="power" class="metric-value">—</span></div><div class="metric"><span id="timeLabel" class="metric-label">Zeit bis voll</span><span id="time" class="metric-value">—</span></div><div class="metric"><span id="limitLabel" class="metric-label">Ladelimit</span><span id="chargeLimit" class="metric-value">—</span></div><div class="metric"><span id="modeLabel" class="metric-label">Lademodus</span><span id="chargeMode" class="metric-value">—</span></div></div></div></div>
  </div>

</div>
<script>
const CAR_DESIGNS={enyaq:{body:'M76 18 Q110 6 144 18 Q162 29 169 58 L174 111 L177 261 Q174 306 148 337 Q110 352 72 337 Q46 306 43 261 L46 111 L51 58 Q58 29 76 18Z',mirrorL:'M49 78 Q29 70 25 86 Q29 100 46 96Z',mirrorR:'M171 78 Q191 70 195 86 Q191 100 174 96Z',frontGlass:'M70 57 Q110 40 150 57 L158 117 Q110 101 62 117Z',rearGlass:'M61 263 Q110 279 159 263 L150 316 Q110 332 70 316Z',roof:'M76 128 Q110 119 144 128 L149 206 Q110 217 71 206Z',windowL:'M63 121 L54 151 L55 247 L66 257',windowR:'M157 121 L166 151 L165 247 L154 257',doorL:'M55 132 L49 161 L50 247 L64 259',doorR:'M165 132 L171 161 L170 247 L156 259',hood:'M64 52 Q110 34 156 52',trunk:'M68 319 Q110 337 152 319',frontLamp:'M67 29 Q110 17 153 29 L147 39 Q110 30 73 39Z',rearLamp:'M70 329 Q110 342 150 329 L144 339 Q110 349 76 339Z',battery:[68,184]},elroq:{body:'M79 20 Q110 10 141 20 Q158 31 165 60 L171 116 L174 259 Q171 302 146 334 Q110 348 74 334 Q49 302 46 259 L49 116 L55 60 Q62 31 79 20Z',mirrorL:'M53 80 Q33 73 29 88 Q33 99 49 97Z',mirrorR:'M167 80 Q187 73 191 88 Q187 99 171 97Z',frontGlass:'M72 61 Q110 47 148 61 L154 119 Q110 105 66 119Z',rearGlass:'M65 262 Q110 276 155 262 L147 313 Q110 327 73 313Z',roof:'M79 130 Q110 123 141 130 L145 204 Q110 212 75 204Z',windowL:'M67 122 L59 151 L60 245 L69 256',windowR:'M153 122 L161 151 L160 245 L151 256',doorL:'M59 134 L53 162 L54 246 L68 257',doorR:'M161 134 L167 162 L166 246 L152 257',hood:'M68 56 Q110 42 152 56',trunk:'M72 316 Q110 331 148 316',frontLamp:'M70 32 Q110 22 150 32 L144 41 Q110 34 76 41Z',rearLamp:'M73 326 Q110 338 147 326 L141 335 Q110 344 79 335Z',battery:[68,184]},epiq:{body:'M82 24 Q110 15 138 24 Q154 35 161 63 L167 121 L170 257 Q167 298 143 328 Q110 341 77 328 Q53 298 50 257 L53 121 L59 63 Q66 35 82 24Z',mirrorL:'M57 83 Q38 77 34 91 Q38 102 52 99Z',mirrorR:'M163 83 Q182 77 186 91 Q182 102 168 99Z',frontGlass:'M75 64 Q110 52 145 64 L151 120 Q110 108 69 120Z',rearGlass:'M69 260 Q110 273 151 260 L143 309 Q110 322 77 309Z',roof:'M82 131 Q110 125 138 131 L let lastState=null,renderQueued=false;
function byId(id){return document.getElementById(id)}function text(id,value){const el=byId(id);if(el)el.textContent=value??''}function path(id,d){const el=byId(id);if(el)el.setAttribute('d',d||'')}function cls(id,name,on){const el=byId(id);if(el)el.classList.toggle(name,!!on)}function normalizeMessage(message){let data=message;if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return null}}return data&&typeof data==='object'?data:null}function lerp(a,b,t){return Math.round(a+(b-a)*t)}function hexToRgb(hex){hex=hex.replace('#','');return[parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}function rgbToHex(rgb){return'#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('')}function mixColor(a,b,t){const ar=hexToRgb(a),br=hexToRgb(b);return rgbToHex([lerp(ar[0],br[0],t),lerp(ar[1],br[1],t),lerp(ar[2],br[2],t)])}
function batteryColor(soc){const stops=[[0,'#d93f43'],[10,'#d93f43'],[25,'#f59e0b'],[80,'#79c267'],[100,'#138a4b']],v=Math.max(0,Math.min(100,Number(soc)||0));for(let i=1;i<stops.length;i++){if(v<=stops[i][0]){const p=(v-stops[i-1][0])/(stops[i][0]-stops[i-1][0]||1);return mixColor(stops[i-1][1],stops[i][1],p)}}return stops[stops.length-1][1]}
function updateBattery(soc,target){const valid=Number.isFinite(Number(soc)),v=valid?Math.max(0,Math.min(100,Number(soc))):0,filled=valid&&v>0?Math.max(1,Math.min(4,Math.ceil(v/25))):0,color=batteryColor(v);for(let i=1;i<=4;i++){const el=byId('bat'+i);if(el){el.style.fill=i<=filled?color:'rgba(127,127,127,.14)';el.style.opacity=i<=filled?'1':'.58'}}text('socText',valid?Math.round(v)+'%':'--%');text('limitText','Limit '+(target===null||target===undefined?'—':target+'%'))}
function applyCarDesign(name){const d=CAR_DESIGNS[name]||CAR_DESIGNS.generic;path('carBody',d.body);path('mirrorL',d.mirrorL);path('mirrorR',d.mirrorR);path('frontGlass',d.frontGlass);path('rearGlass',d.rearGlass);path('sunroofPanel',d.roof);path('windowMarkL',d.windowL);path('windowMarkR',d.windowR);path('doorMarkL',d.doorL);path('doorMarkR',d.doorR);path('hoodLine',d.hood);path('trunkLine',d.trunk);path('frontLamp',d.frontLamp);path('rearLamp',d.rearLamp);byId('batteryGroup')?.setAttribute('transform','translate('+d.battery[0]+' '+d.battery[1]+')')}
function render(data){if(!data)return;lastState=data;try{sessionStorage.setItem('myskoda-last-state',JSON.stringify(data))}catch(e){}const labels=data.labels||{},charge=data.charge||{},climate=data.climate||{};text('title',data.title||'MySkoda');text('range',data.range||'—');text('age',data.age||'--:--');text('mileage',data.mileage||'—');text('rangeLabel',labels.range||'Reichweite');text('updatedLabel',labels.updated||'Letzte Abfrage');text('mileageLabel',labels.mileage||'Kilometerstand');text('powerLabel',labels.power||'Ladeleistung');text('timeLabel',labels.time||'Zeit bis voll');text('limitLabel',labels.limit||'Ladelimit');text('modeLabel',labels.mode||'Lademodus');text('climateLabel',labels.climate||'Klima');applyCarDesign(data.vehicleDesign||'generic');updateBattery(data.soc,data.targetSoc);const body=byId('carBody');if(body){body.classList.toggle('car-outline-good',!!data.locked);body.classList.toggle('car-outline-attn',!data.locked)}cls('doorMarkL','attention',!!data.doorsOpen);cls('doorMarkR','attention',!!data.doorsOpen);cls('windowMarkL','attention',!!data.windowsOpen);cls('windowMarkR','attention',!!data.windowsOpen);cls('sunroofPanel','attention',!!data.sunroofAvailable&&!!data.sunroofOpen);cls('hoodLine','attention',!!data.bonnetAvailable&&!!data.bonnetOpen);cls('trunkLine','attention',!!data.trunkAvailable&&!!data.trunkOpen);cls('frontLamp','attention',!!data.lightsOn);cls('rearLamp','attention',!!data.lightsOn);const lockLine=byId('lockLine');if(lockLine)lockLine.classList.toggle('attention',!data.locked);text('lockText',data.locked?(labels.vehicleLocked||'Fahrzeug verriegelt'):(data.lockText||'Entriegelt'));const chargeEl=byId('charge');if(chargeEl)chargeEl.className='chargebox '+(charge.stateClass||'idle');text('plugIcon',charge.icon||'○');text('chargeLabel',charge.label||'');text('chargeHint',charge.hint||charge.type||'');text('power',charge.power||'—');text('time',charge.time||'—');text('chargeLimit',charge.limit||'—');text('chargeMode',charge.mode||'—');const climateEl=byId('climate');if(climateEl)climateEl.classList.toggle('active',!!climate.active);text('climateIcon',climate.symbol||'○');text('climateMode',climate.mode||'—');text('targetTemperature',climate.temperature||'—');const keyWarn=byId('keyWarning');if(keyWarn){keyWarn.style.display=data.keyWarning?'block':'none';keyWarn.textContent=data.keyWarning?'⚠ '+(data.keyWarningText||''):''}}
function handleMessage(message){const data=normalizeMessage(message);if(data)render(data)}function rerender(){if(renderQueued)return;renderQueued=true;requestAnimationFrame(()=>{renderQueued=false;if(lastState)render(lastState)})}

</script>
