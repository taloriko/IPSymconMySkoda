<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>
:root{
    --ok:#18a34a;
    --warn:#d88608;
    --error:#d64242;
    --text:inherit;
    --line:rgba(127,127,127,.22);
    --soft:rgba(127,127,127,.075);
    --soft2:rgba(127,127,127,.11);
    --glass:#17212a;
}
html,body{margin:0;padding:0;width:100%;height:100%;background:transparent;color:inherit}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;overflow:auto}
*{box-sizing:border-box}
.tile{width:100%;min-height:100%;padding:9px 11px;color:inherit;background:transparent;line-height:1.12}
.head{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:start;padding:1px 1px 7px;border-bottom:1px solid var(--line)}
.title{font-size:1.12rem;font-weight:800;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.range{font-size:.69rem;opacity:.70;margin-top:3px}.range strong{font-size:.85rem;opacity:1}.headright{text-align:right}.lockhead{font-size:1rem;line-height:1}.age{font-size:.62rem;opacity:.60;margin-top:3px;white-space:nowrap}
.keywarn{display:none;margin-top:6px;padding:5px 8px;border-left:3px solid var(--warn);background:rgba(216,134,8,.09);font-size:.63rem;font-weight:650}
.hero{display:grid;grid-template-columns:minmax(155px,45%) minmax(0,1fr);gap:11px;align-items:stretch;padding:9px 0 7px}
.car-panel{min-width:0;display:flex;align-items:center;justify-content:center;padding:0 2px}.car-svg{width:100%;height:292px;max-height:42vh;min-height:225px;filter:drop-shadow(0 6px 7px rgba(0,0,0,.13))}
.rightcol{min-width:0;display:flex;flex-direction:column;gap:7px}
.chargebox{padding:10px 11px;background:var(--soft);border-radius:13px;min-height:0;flex:1}.chargehead{display:flex;align-items:center;gap:9px;padding-bottom:8px}.plugcircle{width:38px;height:38px;flex:0 0 38px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:rgba(127,127,127,.095)}.plugicon{font-size:1.38rem;line-height:1}.chargecopy{min-width:0}.chargetitle{font-size:.82rem;font-weight:790;line-height:1.15}.chargehint{font-size:.58rem;opacity:.60;margin-top:3px}.chargebox.ok .chargetitle,.chargebox.done .chargetitle{color:var(--ok)}.chargebox.warn .chargetitle{color:var(--warn)}.chargebox.error .chargetitle{color:var(--error)}
.metrics{border-top:1px solid var(--line)}.metric{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid var(--line)}.metric:last-child{border-bottom:0}.metric-label{font-size:.62rem;opacity:.58}.metric-value{font-size:.82rem;font-weight:760;text-align:right;white-space:nowrap}
.quick{display:grid;grid-template-columns:1fr 1fr;gap:7px}.quickbox{background:var(--soft);border-radius:12px;padding:9px 10px;min-width:0;display:flex;align-items:center;gap:8px}.quickicon{width:33px;height:33px;flex:0 0 33px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--soft2);font-size:1rem}.climate.active .quickicon{color:var(--ok);background:rgba(24,163,74,.12)}.quicktitle{font-size:.70rem;font-weight:780;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.quicksub{font-size:.58rem;opacity:.60;margin-top:2px;white-space:nowrap}.kmvalue{font-size:.74rem;font-weight:790;margin-top:2px;white-space:nowrap}
.status-list{border-top:1px solid var(--line);margin-top:1px;padding-top:2px}.status-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:center;min-height:34px;padding:5px 5px;border-bottom:1px solid var(--line)}.status-row:last-child{border-bottom:0}.status-left{display:flex;align-items:center;gap:8px;min-width:0}.state-dot{width:7px;height:7px;flex:0 0 7px;border-radius:50%;background:var(--ok)}.status-row.attention .state-dot{background:var(--warn)}.status-row.unavailable{display:none}.status-icon{width:18px;height:18px;flex:0 0 18px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;opacity:.90}.status-label{font-size:.69rem;font-weight:650;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.status-value{font-size:.68rem;font-weight:720;color:var(--ok);text-align:right;white-space:nowrap}.status-row.attention .status-value{color:var(--warn)}
.model-caption{text-align:center;font-size:.52rem;opacity:.45;margin-top:-3px}
.car-body{fill:url(#bodyGradient);stroke:rgba(60,60,60,.60);stroke-width:1.8}.car-outline-good{stroke:var(--ok);stroke-width:2.3}.car-outline-attn{stroke:var(--warn);stroke-width:2.3}.glass{fill:url(#glassGradient);stroke:rgba(127,127,127,.35);stroke-width:1}.roof-glass{fill:rgba(18,27,34,.84);stroke:rgba(127,127,127,.40);stroke-width:1.1}.sunroof-attn{stroke:var(--warn);stroke-width:2.8}.wheel{fill:#2b2f33;stroke:rgba(127,127,127,.42);stroke-width:1}.wheelhub{fill:rgba(200,200,200,.20)}.mirror{fill:url(#bodyGradient);stroke:rgba(127,127,127,.48);stroke-width:1}.body-line{fill:none;stroke:rgba(127,127,127,.30);stroke-width:1.1}.door-line{fill:none;stroke:rgba(127,127,127,.28);stroke-width:1.4}.door-line.attention,.window-line.attention{stroke:var(--warn);stroke-width:3}.window-line{fill:none;stroke:rgba(127,127,127,.26);stroke-width:1.3}.lamp{fill:rgba(127,127,127,.18);stroke:rgba(127,127,127,.22);stroke-width:.6}.lamp.attention{fill:#f0aa16;stroke:#f0aa16;filter:drop-shadow(0 0 2px rgba(240,170,22,.55))}
.battery-shell{fill:rgba(245,245,245,.88);stroke:rgba(70,70,70,.40);stroke-width:1.1}.battery-tip{fill:rgba(90,90,90,.65)}.battery-segment{fill:rgba(127,127,127,.14)}.battery-text{fill:#111827;font:800 20px system-ui}.limit-text{fill:#374151;font:600 7.6px system-ui;opacity:.78}
@media(prefers-color-scheme:dark){.battery-shell{fill:rgba(25,30,35,.91);stroke:rgba(210,210,210,.38)}.battery-text{fill:#f4f4f5}.limit-text{fill:#d1d5db}.chargebox,.quickbox{background:rgba(255,255,255,.055)}}
@media(max-width:430px){.tile{padding:7px 8px}.hero{grid-template-columns:minmax(138px,44%) minmax(0,1fr);gap:7px}.car-svg{height:260px;min-height:215px}.chargebox{padding:8px 9px}.plugcircle{width:32px;height:32px;flex-basis:32px}.metric{padding:6px 0}.quickbox{padding:7px 8px;gap:6px}.quickicon{width:28px;height:28px;flex-basis:28px}.status-row{min-height:31px;padding:4px 4px}.status-icon{width:16px;height:16px;flex-basis:16px}.status-label,.status-value{font-size:.63rem}}
@media(max-width:340px){.hero{grid-template-columns:122px minmax(0,1fr)}.car-svg{height:230px}.chargetitle{font-size:.72rem}.chargehint{font-size:.52rem}.metric-label{font-size:.55rem}.metric-value{font-size:.72rem}.quick{grid-template-columns:1fr}.status-label,.status-value{font-size:.59rem}}
</style>
</head>

const CAR_DESIGNS={
    enyaq:{body:'M76 18 Q110 6 144 18 Q161 30 168 58 L174 115 L178 264 Q175 311 146 340 Q110 353 74 340 Q45 311 42 264 L46 115 L52 58 Q59 30 76 18Z',mirrorL:'M50 73 Q32 65 30 81 Q33 94 48 90Z',mirrorR:'M170 73 Q188 65 190 81 Q187 94 172 90Z',frontGlass:'M72 53 Q110 39 148 53 L157 116 Q110 101 63 116Z',rearGlass:'M65 274 Q110 290 155 274 L145 323 Q110 336 75 323Z',sunroof:'M78 126 Q110 116 142 126 L145 177 Q110 188 75 177Z',winL:'M62 122 L53 145 L52 245 L65 268',winR:'M158 122 L167 145 L168 245 L155 268',doorL:'M54 122 L45 140 L45 251 L61 270',doorR:'M166 122 L175 140 L175 251 L159 270',hood:'M68 44 Q110 31 152 44',trunk:'M72 327 Q110 340 148 327',frontLamp:'M70 28 Q110 16 150 28 L145 35 Q110 25 75 35Z',rearLamp:'M74 332 Q110 343 146 332 L140 339 Q110 347 80 339Z',battery:[68,190]},

function byId(id){return document.getElementById(id)}
function text(id,value){const el=byId(id);if(el)el.textContent=value??''}
function toggleClass(el,name,on){if(el)el.classList.toggle(name,!!on)}
function lerp(a,b,t){return Math.round(a+(b-a)*t)}
function hexToRgb(hex){hex=hex.replace('#','');return [parseInt(hex.slice(0,2),16),parseInt(hex.slice(2,4),16),parseInt(hex.slice(4,6),16)]}
function rgbToHex(rgb){return '#'+rgb.map(v=>v.toString(16).padStart(2,'0')).join('')}
function mixColor(a,b,t){const ar=hexToRgb(a),br=hexToRgb(b);return rgbToHex([lerp(ar[0],br[0],t),lerp(ar[1],br[1],t),lerp(ar[2],br[2],t)])}
function batteryColor(soc){const stops=[[0,'#d93f43'],[10,'#d93f43'],[25,'#f59e0b'],[80,'#79c267'],[100,'#0b7d3b']];const v=Math.max(0,Math.min(100,Number(soc)||0));for(let i=1;i<stops.length;i++){if(v<=stops[i][0]){const p=(v-stops[i-1][0])/(stops[i][0]-stops[i-1][0]||1);return mixColor(stops[i-1][1],stops[i][1],p)}}return stops[stops.length-1][1]}
function updateBattery(soc,target){const valid=Number.isFinite(Number(soc));const value=valid?Math.max(0,Math.min(100,Number(soc))):0;const filled=valid&&value>0?Math.max(1,Math.min(4,Math.ceil(value/25))):0;const color=batteryColor(value);for(let i=1;i<=4;i++){const el=byId('bat'+i);if(!el)continue;el.style.fill=i<=filled?color:'rgba(127,127,127,.14)';el.style.opacity=i<=filled?'1':'.60'}text('socText',valid?Math.round(value)+'%':'--%');text('limitText','Limit '+(target===null||target===undefined?'—':target+'%'))}

function setRow(id,labelId,valueId,label,value,good,available=true){const row=byId(id);if(!row)return;row.classList.toggle('unavailable',!available);row.classList.toggle('attention',available&&!good);text(labelId,label);text(valueId,value)}
function handleMessage(message){let data=message;if(typeof data==='string'){try{data=JSON.parse(data)}catch(e){return}}if(!data||typeof data!=='object')return;const labels=data.labels||{};
    text('title',data.title||'MySkoda');text('range',data.range||'—');text('age',data.age||'--:--');text('mileage',data.mileage||'—');text('rangeLabel',labels.range||'Range');text('updatedLabel',labels.updated||'Updated');text('mileageLabel',labels.mileage||'Mileage');text('powerLabel',labels.power||'Power');text('timeLabel',labels.time||'Time');text('limitLabel',labels.limit||'Limit');text('modeLabel',labels.mode||'Mode');text('climateLabel',labels.climate||'Climate');text('targetTempLabel',labels.targetTemperature||'Target');
    text('lockHead',data.locked?'🔒':'🔓');applyCarDesign(data.vehicleDesign||'generic');text('modelCaption',data.vehicleDesignLabel||'');updateBattery(data.soc,data.targetSoc);
    const body=byId('carBody');if(body){body.classList.toggle('car-outline-good',!!data.locked);body.classList.toggle('car-outline-attn',!data.locked)}
    toggleClass(byId('doorMarkL'),'attention',!!data.doorsOpen);toggleClass(byId('doorMarkR'),'attention',!!data.doorsOpen);toggleClass(byId('windowMarkL'),'attention',!!data.windowsOpen);toggleClass(byId('windowMarkR'),'attention',!!data.windowsOpen);toggleClass(byId('sunroofPanel'),'sunroof-attn',!!data.sunroofOpen);toggleClass(byId('frontLamp'),'attention',!!data.lightsOn);toggleClass(byId('rearLamp'),'attention',!!data.lightsOn);
    setRow('rowLocked','labelLocked','valueLocked',labels.vehicleLocked||'Vehicle locked',data.lockText||(data.locked?(labels.yes||'Yes'):(labels.no||'No')),!!data.locked,true);
    setRow('rowDoors','labelDoors','valueDoors',labels.doors||'Doors',data.doorsOpen?(labels.open||'Open'):(labels.closed||'Closed'),!data.doorsOpen,true);
    setRow('rowWindows','labelWindows','valueWindows',labels.windows||'Windows',data.windowsOpen?(labels.open||'Open'):(labels.closed||'Closed'),!data.windowsOpen,true);
    setRow('rowSunroof','labelSunroof','valueSunroof',labels.sunroof||'Sunroof',data.sunroofText||'—',!data.sunroofOpen,!!data.sunroofAvailable);
    setRow('rowLights','labelLights','valueLights',labels.lights||'Lights',data.lightsOn?(labels.on||'On'):(labels.off||'Off'),!data.lightsOn,true);
    setRow('rowTrunk','labelTrunk','valueTrunk',labels.trunk||'Trunk',data.trunkText||'—',!data.trunkOpen,!!data.trunkAvailable);
    setRow('rowBonnet','labelBonnet','valueBonnet',labels.bonnet||'Bonnet',data.bonnetText||'—',!data.bonnetOpen,!!data.bonnetAvailable);
    const charge=data.charge||{},chargeEl=byId('charge');if(chargeEl)chargeEl.className='chargebox '+(charge.stateClass||'idle');text('plugIcon',charge.icon||'○');text('chargeLabel',charge.label||'');text('chargeHint',charge.hint||charge.type||'');text('power',charge.power||'—');text('time',charge.time||'—');text('chargeLimit',charge.limit||'—');text('chargeMode',charge.mode||'—');
    const climate=data.climate||{},climateEl=byId('climate');toggleClass(climateEl,'active',!!climate.active);text('climateMode',climate.mode||'—');text('targetTemperature',climate.temperature||'—');
    const keyWarn=byId('keyWarning');if(keyWarn){keyWarn.style.display=data.keyWarning?'block':'none';keyWarn.textContent=data.keyWarning?'⚠ '+(data.keyWarningText||''):''}
}
</script>
